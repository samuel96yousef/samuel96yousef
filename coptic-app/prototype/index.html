<!DOCTYPE html>
<html lang="sv" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1f2">
<!-- HEAD:START -->
<title>Koptisk bönbok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Noto+Sans+Coptic&display=swap">
<!-- HEAD:END -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BODY:START -->
<div class="stage">
  <div class="device" id="device">
    <div class="app" id="app" lang="sv" dir="ltr">
      <svg class="sprite" aria-hidden="true" focusable="false">
        <defs>
          <!-- Coptic cross: flared arms, each ending in three buds, ring at the centre -->
          <symbol id="cc" viewBox="0 0 24 24">
            <g id="cc-arm">
              <path d="M10.4 12V5.6Q10.4 4.7 9.3 4.3H14.7Q13.6 4.7 13.6 5.6V12Z"/>
              <circle cx="12" cy="2.2" r="1.55"/>
              <circle cx="9.6" cy="3.4" r="1.2"/>
              <circle cx="14.4" cy="3.4" r="1.2"/>
            </g>
            <use href="#cc-arm" transform="rotate(90 12 12)"/>
            <use href="#cc-arm" transform="rotate(180 12 12)"/>
            <use href="#cc-arm" transform="rotate(270 12 12)"/>
            <path fill-rule="evenodd" d="M12 8.6a3.4 3.4 0 1 1 0 6.8a3.4 3.4 0 1 1 0-6.8zM12 10.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3z"/>
          </symbol>
          <!-- Lattice of interlocking crosses, from the arch on the Katameros title page -->
          <pattern id="pat-lat" width="12" height="12" patternUnits="userSpaceOnUse">
            <path d="M4 0.5h4v3.5h3.5v4H8v3.5H4V8H0.5V4H4z" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.42"/>
          </pattern>
          <!-- Column of medallions with crosses -->
          <pattern id="pat-med" width="35" height="27" patternUnits="userSpaceOnUse" x="8" y="33">
            <circle cx="17.5" cy="13.5" r="10.5" fill="none" stroke="currentColor" stroke-width="0.9"/>
            <circle cx="17.5" cy="13.5" r="7.6" fill="none" stroke="currentColor" stroke-width="0.45"/>
            <path d="M17.5 7.6v11.8M11.6 13.5h11.8" stroke="currentColor" stroke-width="1.7"/>
          </pattern>
        </defs>
      </svg>
      <header class="navbar" id="navbar"></header>
      <main class="views">
        <section class="view" data-view="today" aria-label="Idag"></section>
        <section class="view" data-view="readings" aria-label="Läsningar"></section>
        <section class="view" data-view="agpeya" aria-label="Agpeya"></section>
        <section class="view" data-view="hour" aria-label="Timbön"></section>
        <section class="view" data-view="bible" aria-label="Bibeln"></section>
      </main>
      <nav class="tabbar glass" id="tabbar" role="tablist">
        <span class="lens" aria-hidden="true"></span>
        <button class="tab" role="tab" data-tab="today"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><span>Idag</span></button>
        <button class="tab" role="tab" data-tab="readings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.6c2.6-1.1 5.6-1 9 .9 3.4-1.9 6.4-2 9-.9v13c-2.6-1.1-5.6-1-9 .9-3.4-1.9-6.4-2-9-.9z"/><path d="M12 6.5v13"/></svg><span>Läsningar</span></button>
        <button class="tab" role="tab" data-tab="agpeya"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c1.3 1.5 1.7 2.8 0 4.3-1.7-1.5-1.3-2.8 0-4.3z"/><path d="M9.6 9.2h4.8v11H9.6zM7.5 20.4h9"/></svg><span>Agpeya</span></button>
        <button class="tab" role="tab" data-tab="bible"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v15.7h-11A1.8 1.8 0 0 1 5.7 18.4V5.3a1.8 1.8 0 0 1 .8-1.8z"/><path d="M5.7 18.4a1.8 1.8 0 0 1 1.8-1.8h11M12 7v6M9.8 9.3h4.4"/></svg><span>Bibeln</span></button>
      </nav>
      <div class="langpill glass" id="langpill" role="group" aria-label="Textspråk">
        <span class="lp-lens" aria-hidden="true"></span>
        <button type="button" data-lp="ar" aria-pressed="false" aria-label="العربية"><span class="lp-ar" lang="ar">ع</span></button>
        <button type="button" data-lp="sv" aria-pressed="false" aria-label="Svenska">Sv</button>
      </div>
      <div class="sheet-backdrop" id="backdrop"></div>
      <div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></div>
      <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="fold-control">
    <div id="fold-seg"></div>
    <p id="fold-caption"></p>
  </div>
</div>
<!-- BODY:END -->
<script src="data/texts.js"></script>
<script src="app.js"></script>
</body>
</html>
